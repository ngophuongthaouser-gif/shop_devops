        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <form class="d-flex me-auto my-2 my-lg-0" method="get" action="{% url 'products:index' %}">
                <input class="form-control me-2 search-input" type="search" name="q" placeholder="Tìm sản phẩm"
                       aria-label="Search" value="{{ search_query|default_if_none:'' }}">
                <button class="btn btn-primary search-btn" type="submit">
                    <i class="bi bi-search"></i>

                <li class="nav-item"><a class="nav-link" href="{% url 'home:faq' %}">Hỏi đáp</a></li>
                <li class="nav-item position-relative me-2">
                    <a href="{% url 'cart:detail' %}" class="nav-link">
                        <i class="bi bi-cart" aria-label="Giỏ hàng"></i>
                        {% if cart_total_quantity %}
                        <span id="cartBadgeCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary small">
                            {{ cart_total_quantity }}
                        </span>
                        {% endif %}

                </li>

                    <li class="nav-item dropdown">
